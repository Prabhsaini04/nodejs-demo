<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Task Tracker · nodejs-demo</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <div class="app__brand">
          <span class="app__logo">✓</span>
          <div>
            <h1>Task Tracker</h1>
            <p class="app__subtitle">nodejs-demo</p>
          </div>
        </div>
        <div class="app__stats" id="stats">0 of 0 done</div>
      </header>

      <form class="add-form" id="add-form">
        <input
          type="text"
          id="task-input"
          class="add-form__input"
          placeholder="What needs to be done?"
          autocomplete="off"
          maxlength="200"
          required
        />
        <button type="submit" class="add-form__button">Add Task</button>
      </form>

      <div class="filters" id="filters">
        <button class="filter filter--active" data-filter="all">All</button>
        <button class="filter" data-filter="active">Active</button>
        <button class="filter" data-filter="done">Done</button>
      </div>

      <ul class="task-list" id="task-list"></ul>

      <p class="empty-state" id="empty-state" hidden>Nothing here yet — add your first task above.</p>
    </main>

    <script src="/js/app.js"></script>
  </body>
</html>
